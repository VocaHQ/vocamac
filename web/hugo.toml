baseURL = "https://vocamac.com/"
locale = "en-us"
title = "VocaMac: native voice typing for macOS"

[params]
  description = "Native voice typing for macOS. Hold a hotkey, speak, and text appears at your cursor — transcribed by a Whisper model running on your own Mac. Free and open source."
  author = "Jatin Kumar Malik"
  twitterHandle = "@vocahq"
  githubRepo = "https://github.com/VocaHQ/vocamac"
  ogImagePath = "og-image.png"

[build]
  [build.buildStats]
    enable = false

# Keep attribute quotes on minify so crawlers that match name="description"
# / name="twitter:*" / rel="canonical" still see parser-visible tags.
# Without this, tdewolff emits name=twitter:card (unquoted), which some
# SEO scanners miss even though the tags are present.
[minify]
  [minify.tdewolff.html]
    keepQuotes = true

[sitemap]
  changeFreq = "weekly"
  priority = 0.5

# robots.txt is served from static/robots.txt
enableRobotsTXT = false

# Disable Hugo's default taxonomies since we don't need them
[taxonomies]

# Disable default RSS
disableKinds = ["taxonomy", "term", "RSS"]

# Screenshots stay published at /screenshots/*.png from static/, and are also
# mounted as assets so the image render hook can add resized WebP copies.
# Declaring any mount replaces the defaults, so static/ is listed explicitly.
[module]
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "static/screenshots"
    target = "assets/screenshots"
