{{ define "main" }}
<section class="page-hero" aria-labelledby="page-title">
    <div class="shell">
        <a class="back-link" href="/"><span class="btn-arrow btn-arrow-back" aria-hidden="true">←</span> Back to VocaMac</a>
        <p class="section-tag">real product states</p>
        <h1 id="page-title">Screenshots</h1>
        <p>See VocaMac in the menu bar, during recording, and inside its settings. These images are product proof, not decorative mockups.</p>
    </div>
</section>

<section class="section" aria-labelledby="gallery-title">
    <div class="shell">
        <h2 class="sr-only" id="gallery-title">VocaMac screenshot gallery</h2>
        <div class="gallery">
            <figure class="shot reveal">
                <img src="/screenshots/menu-bar-idle.png" alt="VocaMac menu bar icon in its idle state" width="872" height="328" loading="lazy">
                <figcaption><strong>Menu bar · idle</strong>VocaMac stays ready without taking over the desktop.</figcaption>
            </figure>
            <figure class="shot reveal">
                <img src="/screenshots/menu-bar-recording.png" alt="VocaMac menu bar icon in its recording state" width="796" height="765" loading="lazy">
                <figcaption><strong>Menu bar · recording</strong>A visible state change confirms that audio capture is active.</figcaption>
            </figure>
            <figure class="shot reveal">
                <img src="/screenshots/popover-panel.png" alt="VocaMac popover showing status and the last transcription" width="852" height="508" loading="lazy">
                <figcaption><strong>Popover panel</strong>Check readiness, the selected model, and the last result.</figcaption>
            </figure>
            <figure class="shot reveal">
                <img src="/screenshots/settings-general.png" alt="VocaMac Settings General tab" width="1344" height="1340" loading="lazy">
                <figcaption><strong>General settings</strong>Choose the activation mode, language, and behavior.</figcaption>
            </figure>
            <figure class="shot reveal">
                <img src="/screenshots/settings-models.png" alt="VocaMac Settings Models tab" width="1344" height="1260" loading="lazy">
                <figcaption><strong>Model settings</strong>Inspect hardware information and manage local models.</figcaption>
            </figure>
            <figure class="shot reveal">
                <img src="/screenshots/settings-audio.png" alt="VocaMac Settings Audio tab" width="1344" height="1260" loading="lazy">
                <figcaption><strong>Audio settings</strong>Adjust recording duration, silence detection, and input device.</figcaption>
            </figure>
            <figure class="shot reveal">
                <img src="/screenshots/settings-stats.png" alt="VocaMac Settings Stats tab" width="1344" height="1340" loading="lazy">
                <figcaption><strong>Local statistics</strong>Review words, speaking speed, and daily activity stored on the Mac.</figcaption>
            </figure>
            <figure class="shot reveal">
                <img src="/screenshots/settings-about.png" alt="VocaMac Settings About tab" width="1344" height="1260" loading="lazy">
                <figcaption><strong>About and updates</strong>See app details and the release update path.</figcaption>
            </figure>
            <figure class="shot reveal">
                <img src="/screenshots/cursor-indicator.png" alt="VocaMac cursor indicator beside text during recording" width="1217" height="990" loading="lazy">
                <figcaption><strong>Cursor indicator</strong>An optional floating signal keeps the recording state close to the text.</figcaption>
            </figure>
        </div>
    </div>
</section>
{{ end }}
