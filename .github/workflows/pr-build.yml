name: PR Build

# A maintainer starts this manually after reviewing the exact PR commit.
# The protected environment requires an independent Core team approval before
# any PR code runs in a job that can access signing credentials.

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to build
        required: true
        type: string
      quick:
        description: Skip notarization
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: write
  actions: read

concurrency:
  group: pr-build-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  pr-build:
    name: Build PR
    if: github.ref == 'refs/heads/main'
    environment: pr-signing
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      # ── Setup ─────────────────────────────────────────────────────────────
      - name: Validate PR and reviewed commit
        id: pr
        uses: actions/github-script@v9
        with:
          script: |
            const input = context.payload.inputs.pr_number;
            if (!/^[1-9][0-9]*$/.test(input)) {
              throw new Error('PR number must be a positive integer');
            }
            const number = Number(input);
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: number
            });
            if (pr.data.state !== 'open' ||
                pr.data.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              throw new Error('Only open PRs with a branch in this repository can be signed');
            }
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: number,
              per_page: 100
            });
            const latestByReviewer = new Map();
            for (const review of reviews) {
              latestByReviewer.set(review.user?.login, review);
            }
            const approved = [...latestByReviewer.values()].some(review =>
              review.state === 'APPROVED' &&
              review.commit_id === pr.data.head.sha &&
              review.user?.login !== pr.data.user.login &&
              review.user?.login !== context.actor
            );
            if (!approved) {
              throw new Error('The current PR commit needs an independent approving review');
            }
            core.setOutput('sha', pr.data.head.sha);
            core.setOutput('short_sha', pr.data.head.sha.substring(0, 7));
            core.setOutput('pr_number', number);

      - name: Determine build type
        id: build_type
        run: |
          if [[ "${{ inputs.quick }}" == "true" ]]; then
            {
              echo "QUICK=true"
              echo "BUILD_DESCRIPTION=Build signed DMG (skipping notarization)"
              echo "DIST_FLAGS=--skip-notarize"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "QUICK=false"
              echo "BUILD_DESCRIPTION=Build signed & notarized DMG"
              echo "DIST_FLAGS="
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Post "build started" comment
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          PR_SHA: ${{ steps.pr.outputs.short_sha }}
          BUILD_DESCRIPTION: ${{ steps.build_type.outputs.BUILD_DESCRIPTION }}
          QUICK: ${{ steps.build_type.outputs.QUICK }}
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const description = process.env.BUILD_DESCRIPTION;
            const timeEstimate = process.env.QUICK === 'true' ? '3–5 minutes' : '10–20 minutes';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body: `⏳ **PR Build started** for \`${process.env.PR_SHA}\`\n\n${description}... this usually takes ${timeEstimate}.\n\n[Watch the build →](${runUrl})`
            });

      - name: Checkout reviewed PR commit
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.sha }}
          persist-credentials: false

      - name: Verify checked-out commit
        env:
          EXPECTED_SHA: ${{ steps.pr.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Cache SPM dependencies
        uses: actions/cache@v6
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Select Xcode 26
        run: ./scripts/select-xcode-26.sh

      # ── Test ──────────────────────────────────────────────────────────────
      - name: Run tests
        run: swift test

      - name: Confirm PR still points to reviewed commit
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          EXPECTED_SHA: ${{ steps.pr.outputs.sha }}
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PR_NUMBER)
            });
            if (pr.data.state !== 'open' || pr.data.head.sha !== process.env.EXPECTED_SHA) {
              throw new Error('PR changed during build; request a new signed build');
            }

      - name: Initialize Xcode tools
        run: sudo xcodebuild -runFirstLaunch

      # ── Code Signing Setup ──────────────────────────────────────────────────
      - name: Import Developer ID certificate
        env:
          DEVELOPER_ID_CERT_P12:      ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$DEVELOPER_ID_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$DEVELOPER_ID_CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | xargs)

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)"/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "❌ Developer ID certificate not found after import"
            exit 1
          fi
          echo "✅ Imported: $IDENTITY"
          echo "CODE_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Store notarization credentials
        if: steps.build_type.outputs.QUICK != 'true'
        env:
          NOTARIZE_APPLE_ID: ${{ secrets.NOTARIZE_APPLE_ID }}
          NOTARIZE_TEAM_ID:  ${{ secrets.NOTARIZE_TEAM_ID }}
          NOTARIZE_PASSWORD: ${{ secrets.NOTARIZE_PASSWORD }}
        run: |
          xcrun notarytool store-credentials "AC_PASSWORD" \
            --apple-id  "$NOTARIZE_APPLE_ID" \
            --team-id   "$NOTARIZE_TEAM_ID" \
            --password  "$NOTARIZE_PASSWORD"

      # ── Build & Package ─────────────────────────────────────────────────────
      - name: Set PR build version
        run: |
          # Tag the build so it's identifiable (e.g., 0.6.2-pr.106+abc1234)
          BASE_VERSION="${APP_VERSION:-}"
          if [ -z "$BASE_VERSION" ]; then
            BASE_VERSION="$(grep '^APP_VERSION=' scripts/build.sh | sed 's/.*:-\(.*\)}.*/\1/' | head -1 || true)"
          fi
          if [ -z "$BASE_VERSION" ]; then
            echo "❌ Unable to determine base app version from scripts/build.sh" >&2
            exit 1
          fi
          PR_VERSION="${BASE_VERSION}-pr.${{ steps.pr.outputs.pr_number }}+${{ steps.pr.outputs.short_sha }}"
          echo "APP_VERSION=$PR_VERSION" >> "$GITHUB_ENV"
          echo "📦 Build version: $PR_VERSION"

      - name: Build signed DMG
        run: ./scripts/dist.sh ${{ steps.build_type.outputs.DIST_FLAGS }}

      - name: Verify code signature
        run: codesign -v --deep --strict VocaMac.app

      - name: Verify SPM resource bundles are correctly staged
        # Mirrors the validation in release.yml and nightly.yml so PR builds
        # catch bundle-layout regressions (the #119 class of bug) before they
        # reach a release. xcodebuild's Bundle.module accessor resolves to
        # Contents/Resources/, and bundles must NOT live at the .app root
        # (codesign will reject that layout).
        run: |
          echo "🔍 Checking SPM resource bundle layout..."
          FAIL=0

          # Bundles must NOT be at the .app root (codesign rejects that).
          if ls VocaMac.app/*.bundle 1>/dev/null 2>&1; then
            echo "❌ Found .bundle at app root — will break codesign!"
            ls VocaMac.app/*.bundle
            FAIL=1
          fi

          FOUND_ANY=false
          for bundle in VocaMac.app/Contents/Resources/*.bundle; do
            [ -d "$bundle" ] || continue
            FOUND_ANY=true
            name="$(basename "$bundle")"
            echo "✅ $name — present in Contents/Resources/"
          done

          if [ "$FOUND_ANY" = false ]; then
            echo "❌ No .bundle directories found in Contents/Resources/!"
            FAIL=1
          fi


          # Verify the binary uses the xcodebuild accessor (contains resourceURL)
          if strings VocaMac.app/Contents/MacOS/VocaMac | grep -q 'resourceURL'; then
            echo "✅ Binary uses xcodebuild Bundle.module accessor"
          else
            echo "❌ Binary does NOT contain resourceURL — wrong accessor!"
            echo "   Ensure build.sh uses xcodebuild, not swift build."
            FAIL=1
          fi

          if [ "$FAIL" -ne 0 ]; then
            echo ""
            echo "Bundle layout validation failed. See above for details."
            exit 1
          fi

          echo ""
          echo "✅ All bundle checks passed."

      - name: Gather artifacts
        id: artifacts
        run: |
          DMG_FILE=$(ls dist/VocaMac-*.dmg | head -1)
          DMG_NAME=$(basename "$DMG_FILE")
          DMG_SIZE=$(du -h "$DMG_FILE" | cut -f1)
          DMG_SHA=$(shasum -a 256 "$DMG_FILE" | awk '{print $1}')

          echo "dmg_path=$DMG_FILE" >> "$GITHUB_OUTPUT"
          echo "dmg_name=$DMG_NAME" >> "$GITHUB_OUTPUT"
          echo "dmg_size=$DMG_SIZE" >> "$GITHUB_OUTPUT"
          echo "dmg_sha=$DMG_SHA" >> "$GITHUB_OUTPUT"

      # ── Upload & Notify ─────────────────────────────────────────────────────
      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        id: upload
        with:
          name: ${{ steps.artifacts.outputs.dmg_name }}
          path: ${{ steps.artifacts.outputs.dmg_path }}
          retention-days: 14

      - name: Post download comment on PR
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          PR_SHA: ${{ steps.pr.outputs.short_sha }}
          QUICK: ${{ steps.build_type.outputs.QUICK }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          DMG_NAME: ${{ steps.artifacts.outputs.dmg_name }}
          DMG_SIZE: ${{ steps.artifacts.outputs.dmg_size }}
          DMG_SHA: ${{ steps.artifacts.outputs.dmg_sha }}
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const artifactUrl = `${runUrl}/artifacts/${process.env.ARTIFACT_ID}`;
            const isQuick = process.env.QUICK === 'true';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body: [
                `✅ **PR Build ready!**`,
                ``,
                `| | |`,
                `|---|---|`,
                `| **DMG** | [\`${process.env.DMG_NAME}\`](${artifactUrl}) |`,
                `| **Size** | ${process.env.DMG_SIZE} |`,
                `| **Commit** | \`${process.env.PR_SHA}\` |`,
                `| **Signed** | ✅ Developer ID |`,
                `| **Notarized** | ${isQuick ? '⏭️ Skipped' : '✅ Apple'} |`,
                ``,
                `### 📥 Install`,
                `1. Click the DMG link above to download`,
                `2. Open the DMG and drag VocaMac to Applications (replace existing)`,
                `3. Open VocaMac — ${isQuick ? 'Right-click → Open once to bypass Gatekeeper' : 'No Gatekeeper warnings'}, no permission resets`,
                ``,
                `<details><summary>SHA-256 checksum</summary>`,
                ``,
                `\`\`\``,
                `${process.env.DMG_SHA}  ${process.env.DMG_NAME}`,
                `\`\`\``,
                `</details>`,
                ``,
                `> 💡 A maintainer can start another PR Build from the Actions tab.`
              ].join('\n')
            });

      # ── Cleanup ─────────────────────────────────────────────────────────────
      - name: Delete temporary keychain
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true

      # ── Failure notification ────────────────────────────────────────────────
      - name: Post failure comment
        if: failure()
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          PR_SHA: ${{ steps.pr.outputs.short_sha }}
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body: `❌ **PR Build failed** for \`${process.env.PR_SHA}\`\n\n[View build logs →](${runUrl})\n\n> 💡 A maintainer can retry from the Actions tab.`
            });
