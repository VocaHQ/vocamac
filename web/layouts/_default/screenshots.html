{{ define "main" }}
<section class="page-hero" aria-labelledby="page-title">
    <div class="shell">
        <a class="back-link" href="/"><span class="btn-arrow btn-arrow-back" aria-hidden="true">←</span> Back to VocaMac</a>
        <p class="section-tag">real product states</p>
        <h1 id="page-title">Screenshots</h1>
        <p>See VocaMac in the menu bar, during recording, and inside its settings. These images are product proof, not decorative mockups.</p>
    </div>
</section>

<section class="section" aria-labelledby="gallery-title">
    <div class="shell">
        <h2 class="sr-only" id="gallery-title">VocaMac screenshot gallery</h2>
        <div class="gallery">
            <figure class="shot reveal">
                <img src="/screenshots/menu-bar-idle.png" alt="VocaMac menu bar icon in its idle state" width="636" height="76" loading="lazy">
                <figcaption><strong>Menu bar · idle</strong>VocaMac stays ready without taking over the desktop.</figcaption>
            </figure>
            <figure class="shot reveal">
                <img src="/screenshots/menu-bar-recording.png" alt="VocaMac menu bar icon in its recording state" width="1040" height="80" loading="lazy">
                <figcaption><strong>Menu bar · recording</strong>A visible state change confirms that audio capture is active.</figcaption>
            </figure>
            <figure class="shot reveal">
                <img src="/screenshots/popover-panel.png" alt="VocaMac popover showing status and the selected model" width="760" height="340" loading="lazy">
                <figcaption><strong>Popover panel</strong>Check readiness, the selected model, and microphone.</figcaption>
            </figure>
            <figure class="shot reveal">
                <img src="/screenshots/settings-general.png" alt="VocaMac Settings Dictation page" width="1520" height="1288" loading="lazy">
                <figcaption><strong>Dictation</strong>Choose the activation mode, hotkey, and output behavior.</figcaption>
            </figure>
            <figure class="shot reveal">
                <img src="/screenshots/settings-models.png" alt="VocaMac Settings Speech Model page" width="1520" height="1288" loading="lazy">
                <figcaption><strong>Speech Model</strong>Pick an engine and manage local models.</figcaption>
            </figure>
            <figure class="shot reveal">
                <img src="/screenshots/settings-audio.png" alt="VocaMac Settings Audio page" width="1520" height="1288" loading="lazy">
                <figcaption><strong>Audio</strong>Adjust recording duration, silence detection, and input device.</figcaption>
            </figure>
            <figure class="shot reveal">
                <img src="/screenshots/settings-application.png" alt="VocaMac Settings Application page" width="1520" height="1288" loading="lazy">
                <figcaption><strong>Application</strong>Launch at login, clipboard, and recording overlay.</figcaption>
            </figure>
            <figure class="shot reveal">
                <img src="/screenshots/settings-stats.png" alt="VocaMac Settings Stats page" width="1520" height="1288" loading="lazy">
                <figcaption><strong>Local statistics</strong>Review words, speaking speed, and daily activity stored on the Mac.</figcaption>
            </figure>
            <figure class="shot reveal">
                <img src="/screenshots/settings-about.png" alt="VocaMac Settings About page" width="1520" height="1288" loading="lazy">
                <figcaption><strong>About and updates</strong>See app details and the release update path.</figcaption>
            </figure>
            <figure class="shot reveal">
                <img src="/screenshots/cursor-indicator.png" alt="VocaMac recording overlay while listening" width="222" height="92" loading="lazy">
                <figcaption><strong>Recording overlay</strong>An optional floating signal shows listening state while you dictate.</figcaption>
            </figure>
        </div>
    </div>
</section>
{{ end }}
