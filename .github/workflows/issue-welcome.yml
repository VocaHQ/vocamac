name: Welcome

# pull_request_target lets the welcome comment reach PRs from forks. The
# reusable workflow only posts a comment; it never checks out PR code.
on: # zizmor: ignore[dangerous-triggers]
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  welcome:
    uses: VocaHQ/.github/.github/workflows/issue-welcome.yml@main
