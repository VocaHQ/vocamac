# Centralized VocaMac product facts.
#
# Status and OS floor follow VocaHQ/vocahq PRODUCT.md:
# Available now, macOS 14+ Apple Silicon, Homebrew or DMG, AGPL-3.0.
# Available now was verified against VocaHQ/vocahq PRODUCT.md.
# Version/artifact figures were verified against the tagged v1.0.0 release.
# Re-verify this file before publishing a website change.
#
# Verified: 2026-09-23 against v1.0.0 and its tagged release assets.

[stable]
version = "1.0.0"
tag = "v1.0.0"
status = "Available now"
released = "2026-09-23"
releaseURL = "https://github.com/VocaHQ/vocamac/releases/tag/v1.0.0"
releasesURL = "https://github.com/VocaHQ/vocamac/releases"
latestURL = "https://github.com/VocaHQ/vocamac/releases/latest"
dmg = "VocaMac-1.0.0-arm64.dmg"
dmgURL = "https://github.com/VocaHQ/vocamac/releases/download/v1.0.0/VocaMac-1.0.0-arm64.dmg"
dmgSize = "115 MB"

[requirements]
os = "macOS 14 Sonoma or later"
osShort = "macOS 14+"
arch = "Apple Silicon"
archNote = "Apple Silicon only. There is no supported Intel build."
signing = "Developer ID signed and notarized by Apple"
permissions = ["Microphone", "Accessibility", "Input Monitoring"]

# Languages that can actually be pinned in Settings in v1.0.0, verified against
# TranscriptionLanguage.selectable in TranscriptionLanguage.swift.
# The Whisper model is trained on ~99 languages, but only these are selectable,
# so the site must not claim "99+ languages".
[languages]
count = 43
list = "Arabic, Bengali, Bulgarian, Catalan, Chinese, Croatian, Czech, Danish, Dutch, English, Estonian, Finnish, French, German, Greek, Hebrew, Hindi, Hungarian, Indonesian, Italian, Japanese, Korean, Latvian, Lithuanian, Macedonian, Malay, Maltese, Norwegian, Persian, Polish, Portuguese, Romanian, Russian, Serbian, Slovak, Slovenian, Spanish, Swedish, Tamil, Thai, Turkish, Ukrainian, and Vietnamese"
autoDetect = true

[engine]
name = "WhisperKit"
url = "https://github.com/argmaxinc/WhisperKit"
runtime = "CoreML"
modelRepo = "argmaxinc/whisperkit-coreml"
modelRepoURL = "https://huggingface.co/argmaxinc/whisperkit-coreml"

# The WhisperKit model picker shown in Settings in v1.0.0 (ModelSize.standardCatalog).
# size/ram are the values the app itself reports (fileSizeDescription and the
# loaded ramRequiredGB from ModelRAMFit, #311).
[[models]]
id = "tiny"
name = "Tiny"
size = "77 MB"
ram = "0.5 GB"
quality = "Good"
note = "Fastest. Good for short commands and quick notes."

[[models]]
id = "base"
name = "Base"
size = "147 MB"
ram = "1 GB"
quality = "Better"
note = "A small step up in accuracy for very little extra weight."

[[models]]
id = "small"
name = "Small"
size = "487 MB"
ram = "1.5 GB"
quality = "Great"
note = "A sensible default on 8 GB Macs."

[[models]]
id = "large-v3-turbo-compact"
name = "Large v3 Turbo (Compact)"
size = "646 MB"
ram = "2 GB"
quality = "Excellent"
note = "The best accuracy-per-second trade-off for most people."

[[models]]
id = "distil-large-v3-compact"
name = "Distil Large v3 (Compact)"
size = "595 MB"
ram = "2 GB"
quality = "Excellent"
note = "Distilled for speed. English-focused."

[[models]]
id = "distil-large-v3-turbo"
name = "Distil Large v3 Turbo"
size = "607 MB"
ram = "2 GB"
quality = "Excellent"
note = "The fastest of the distilled variants."

[[models]]
id = "large-v3-latest-compact"
name = "Large v3 Latest (Compact)"
size = "627 MB"
ram = "2 GB"
quality = "Best"
note = "Full large-model accuracy, compressed."

[[models]]
id = "large-v3-latest"
name = "Large v3 Latest"
size = "1.6 GB"
ram = "3.5 GB"
quality = "Best"
note = "Highest accuracy. The largest download."

[[models]]
id = "voca-hinglish"
name = "Voca Hinglish"
size = "824 MB"
ram = "1.5 GB"
quality = "Best for Hindi"
note = "Writes Hindi speech in Roman script (Hinglish). Fine-tuned from Oriserve's Whisper Hindi2Hinglish Apex."

# Additional engines and models in v1.0.0. Sizes and notes follow the shipped
# catalogs in WhisperModel.swift and SherpaModelCatalog.swift.
[[releaseModels]]
id = "parakeet-v3"
name = "Parakeet v3"
engine = "Parakeet"
size = "483 MB"
note = "Fastest engine. 25 European languages + Japanese, auto-detected."

[[releaseModels]]
id = "parakeet-v2"
name = "Parakeet v2"
engine = "Parakeet"
size = "464 MB"
note = "Fastest engine. English only, highest recall."

[[releaseModels]]
id = "parakeet-110m"
name = "Parakeet 110M"
engine = "Parakeet"
size = "227 MB"
note = "English only, smaller download and faster first load."

[[releaseModels]]
id = "apple-speech"
name = "Apple Speech"
engine = "Apple Speech"
size = "Managed by macOS"
note = "macOS 26+ system engine (SpeechAnalyzer). Roughly 30 locales."

[[releaseModels]]
id = "moonshine-v2-tiny"
name = "Moonshine v2 Tiny"
engine = "sherpa-onnx"
size = "44 MB"
note = "CPU-only. Very low-RAM Macs, English."

[[releaseModels]]
id = "moonshine-v2-base"
name = "Moonshine v2 Base"
engine = "sherpa-onnx"
size = "142 MB"
note = "CPU-only. Low-RAM Macs, English."

[[releaseModels]]
id = "sense-voice"
name = "SenseVoice"
engine = "sherpa-onnx"
size = "241 MB"
note = "CPU-only. Chinese, Japanese, Korean, Cantonese, English."

[[releaseModels]]
id = "gigaam-v3"
name = "GigaAM v3"
engine = "sherpa-onnx"
size = "225 MB"
note = "CPU-only. Russian, with punctuation."

[[releaseModels]]
id = "canary-180m-flash"
name = "Canary 180M Flash"
engine = "sherpa-onnx"
size = "207 MB"
note = "CPU-only. English, Spanish, German, French."

[[releaseModels]]
id = "qwen3-asr-0.6b"
name = "Qwen3 ASR 0.6B"
engine = "sherpa-onnx"
size = "1 GB"
note = "CPU-only. 30 languages, including Hindi, Arabic, and Thai."

[links]
repo = "https://github.com/VocaHQ/vocamac"
issues = "https://github.com/VocaHQ/vocamac/issues"
license = "https://github.com/VocaHQ/vocamac/blob/main/LICENSE"
vocahq = "https://vocahq.com/"
homebrewDoc = "https://github.com/VocaHQ/vocamac/blob/main/docs/HOMEBREW.md"

[license]
id = "AGPL-3.0"
name = "GNU Affero General Public License v3.0"

[brew]
tap = "brew tap vocahq/vocamac"
trust = "brew trust vocahq/vocamac"
install = "brew install --cask vocamac"
upgrade = "brew upgrade --cask vocamac"
