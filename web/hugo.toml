baseURL = "https://vocamac.com/"
languageCode = "en-us"
title = "VocaMac - 100% Local Voice-to-Text for macOS"

[params]
  description = "100% offline, open-source voice-to-text for macOS. Powered by WhisperKit + CoreML."
  author = "Jatin Kumar Malik"
  twitterHandle = "@jatinkrmalik"
  githubRepo = "https://github.com/VocaHQ/vocamac"
  gaID = "G-8W6EJV2KP0"
  ogImage = "https://vocamac.com/og-image.png"

[build]
  [build.buildStats]
    enable = false

# Keep attribute quotes on minify so crawlers that match name="description"
# / name="twitter:*" / rel="canonical" still see parser-visible tags.
# Without this, tdewolff emits name=twitter:card (unquoted), which some
# SEO scanners miss even though the tags are present.
[minify]
  [minify.tdewolff.html]
    keepQuotes = true

[sitemap]
  changeFreq = "weekly"
  priority = 0.5

# robots.txt is served from static/robots.txt
enableRobotsTXT = false

# Disable Hugo's default taxonomies since we don't need them
[taxonomies]

# Disable default RSS
disableKinds = ["taxonomy", "term", "RSS"]
