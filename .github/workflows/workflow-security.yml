name: Workflow Security

# zizmor audits the GitHub Actions workflows for template injection, excessive
# token permissions, unpinned actions, credential persistence, and dangerous
# triggers. Findings go to Security → Code scanning, where a code scanning
# ruleset can block a PR that introduces a new one. Config: .github/zizmor.yml.

on:
  push:
    branches: [main]
    paths: ['.github/**']
  pull_request:
    branches: [main]
    paths: ['.github/**']

permissions: {}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
