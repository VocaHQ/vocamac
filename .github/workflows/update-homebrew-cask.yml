# Updates the Homebrew tap cask (VocaHQ/homebrew-vocamac) when a GitHub Release is published.
# Downloads the release DMG, computes its sha256, and opens a reviewable tap PR.
# Can also be triggered manually via workflow_dispatch (optional tag input; defaults to latest)
# so a cask bump can be run for an existing release without publishing a new one.
name: Update Homebrew Cask

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to bump the cask for (e.g. v0.7.0). Leave empty to use the latest release."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  update-cask:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repo
        uses: actions/checkout@v7

      - name: Resolve release tag and version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
            if [ -z "$TAG" ]; then
              TAG=$(gh api "repos/${{ github.repository }}/releases/latest" --jq '.tag_name')
              echo "No tag input provided; using latest release: ${TAG}"
            fi
          else
            TAG="$RELEASE_TAG"
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "::error::Could not resolve a release tag (empty input and no latest release, or API failure)."
            exit 1
          fi
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag must contain a valid version."
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=${TAG} version=${VERSION}"

      - name: Download DMG artifact
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          DMG_URL="https://github.com/VocaHQ/vocamac/releases/download/v${VERSION}/VocaMac-${VERSION}-arm64.dmg"
          curl -fsSL -o vocamac.dmg "$DMG_URL"
          SIZE=$(wc -c < vocamac.dmg)
          if [ "$SIZE" -lt 1000000 ]; then
            echo "::error::Downloaded DMG is suspiciously small (${SIZE} bytes); refusing to update cask."
            exit 1
          fi
          echo "Downloaded DMG from ${DMG_URL} (${SIZE} bytes)"

      - name: Compute DMG sha256
        id: checksum
        run: |
          SHA256=$(shasum -a 256 vocamac.dmg | cut -d' ' -f1)
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"
          echo "Computed sha256: ${SHA256}"

      - name: Checkout tap repo
        uses: actions/checkout@v7
        with:
          repository: VocaHQ/homebrew-vocamac
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-vocamac

      - name: Prepare tap update branch
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cd homebrew-vocamac
          BRANCH="automation/vocamac-v${VERSION}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            git fetch origin "$BRANCH"
            git switch -C "$BRANCH" FETCH_HEAD
          else
            git switch -c "$BRANCH"
          fi

      - name: Update cask file
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.checksum.outputs.sha256 }}
        run: |
          set -euo pipefail
          CASK_FILE="homebrew-vocamac/Casks/vocamac.rb"

          # Update the version line
          sed -i "s/^  version \".*\"/  version \"${VERSION}\"/" "$CASK_FILE"
          # Update the sha256 line
          sed -i "s/^  sha256 \".*\"/  sha256 \"${SHA256}\"/" "$CASK_FILE"

          echo "Updated ${CASK_FILE}:"
          grep -E "^\s+(version|sha256)" "$CASK_FILE"

      - name: Open tap update pull request
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cd homebrew-vocamac
          BRANCH="automation/vocamac-v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/vocamac.rb
          if git diff --cached --quiet; then
            echo "No cask changes to commit (already at v${VERSION})."
            exit 0
          fi
          git commit -m "chore: update vocamac to v${VERSION}"
          git push -u origin "$BRANCH"
          if [ "$(gh pr list --repo VocaHQ/homebrew-vocamac --head "$BRANCH" --state open --json number --jq 'length')" = "0" ]; then
            gh pr create --repo VocaHQ/homebrew-vocamac --base main --head "$BRANCH" \
              --title "chore: update VocaMac cask to v${VERSION}" \
              --body "Automated cask update for VocaMac v${VERSION}. Review the release artifact URL and SHA-256 before merging."
          fi
